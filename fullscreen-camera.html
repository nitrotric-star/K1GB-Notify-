<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Full Screen Camera</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
  }
  #video {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    background: #000;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: -apple-system, sans-serif;
    font-size: 16px;
    text-align: center;
    padding: 20px;
    background: rgba(0,0,0,0.6);
  }
  #video.mirror {
    transform: scaleX(-1);
  }
  #controls {
    position: fixed;
    top: 14px;
    left: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 10;
    transition: opacity 0.2s;
  }
  #controls.hidden {
    display: none;
  }
  button {
    background: rgba(255,255,255,0.15);
    border: 1.5px solid #fff;
    color: #fff;
    border-radius: 50%;
    width: 30px; height: 30px;
    font-size: 12px;
    backdrop-filter: blur(4px);
  }
  #shotBtn {
    width: 38px; height: 38px;
    font-size: 14px;
  }
  #torchBtn.active {
    background: #ffe066;
    color: #000;
  }
  #torchBtn[disabled] {
    opacity: 0.3;
  }
  #fsBtn {
    position: fixed;
    top: 14px; right: 14px;
    width: 28px; height: 28px;
    font-size: 11px;
    z-index: 10;
  }
  #dotBtn {
    position: fixed;
    bottom: 14px;
    right: 14px;
    width: 10px;
    height: 10px;
    padding: 0;
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    z-index: 15;
  }
  #canvas { display: none; }
  #flash {
    position: fixed; inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 20;
  }
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="flash"></div>
<div id="overlay" style="display:none"></div>

<button id="fsBtn" title="Fullscreen">⛶</button>

<div id="controls">
  <button id="switchBtn">⟲</button>
  <button id="shotBtn">●</button>
  <button id="torchBtn">⚡</button>
</div>

<button id="dotBtn" title="Hide/show controls"></button>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const overlay = document.getElementById('overlay');
const flash = document.getElementById('flash');
const shotBtn = document.getElementById('shotBtn');
const switchBtn = document.getElementById('switchBtn');
const torchBtn = document.getElementById('torchBtn');
const fsBtn = document.getElementById('fsBtn');
const dotBtn = document.getElementById('dotBtn');
const controls = document.getElementById('controls');

dotBtn.addEventListener('click', () => {
  const hiding = !controls.classList.contains('hidden');
  controls.classList.toggle('hidden', hiding);
  fsBtn.style.display = hiding ? 'none' : '';
});

let currentStream = null;
let facingMode = 'environment'; // back camera by default
let torchOn = false;
let hasHardwareTorch = false;
let screenFlashOn = false;

async function startCamera() {
  if (currentStream) {
    currentStream.getTracks().forEach(t => t.stop());
    currentStream = null;
  }
  video.srcObject = null;
  torchOn = false;
  screenFlashOn = false;
  torchBtn.classList.remove('active');
  flash.style.opacity = '0';
  flash.style.zIndex = '20';
  overlay.style.display = 'none';

  const attempts = [
    { video: { facingMode: { exact: facingMode }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false },
    { video: { facingMode: { ideal: facingMode } }, audio: false },
    { video: true, audio: false }
  ];

  let stream = null;
  let lastErr = null;

  // hardware release can take longer on some devices, so retry with backoff
  for (let retry = 0; retry < 4 && !stream; retry++) {
    if (retry > 0) await new Promise(r => setTimeout(r, 400 * retry));
    for (const constraints of attempts) {
      try {
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        break;
      } catch (err) {
        lastErr = err;
      }
    }
  }

  if (!stream) {
    overlay.style.display = 'flex';
    overlay.textContent = 'Camera access failed: ' + (lastErr ? lastErr.message : 'unknown error');
    return;
  }

  currentStream = stream;
  video.srcObject = stream;
  video.classList.toggle('mirror', facingMode === 'user');

  const track = stream.getVideoTracks()[0];
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  hasHardwareTorch = facingMode === 'environment' && !!caps.torch;
  torchBtn.disabled = false; // front camera uses screen-flash fallback instead
}

switchBtn.addEventListener('click', () => {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  startCamera();
});

torchBtn.addEventListener('click', () => {
  if (!currentStream) return;
  if (hasHardwareTorch) {
    const track = currentStream.getVideoTracks()[0];
    torchOn = !torchOn;
    track.applyConstraints({ advanced: [{ torch: torchOn }] }).catch(() => {});
    torchBtn.classList.toggle('active', torchOn);
  } else {
    // no physical flash on front camera - toggle a bright screen overlay instead
    screenFlashOn = !screenFlashOn;
    torchBtn.classList.toggle('active', screenFlashOn);
    flash.style.transition = 'none';
    flash.style.opacity = screenFlashOn ? '0.85' : '0';
    flash.style.zIndex = screenFlashOn ? '5' : '20';
  }
});

fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
    fsBtn.textContent = '×';
  } else {
    document.exitFullscreen().catch(() => {});
    fsBtn.textContent = '⛶';
  }
});

shotBtn.addEventListener('click', () => {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');

  if (facingMode === 'user') {
    // flip the capture so the saved photo matches the mirrored preview
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  if (!screenFlashOn) {
    flash.style.transition = 'none';
    flash.style.opacity = '0.8';
    requestAnimationFrame(() => {
      flash.style.transition = 'opacity 0.3s';
      flash.style.opacity = '0';
    });
  }

  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'photo-' + Date.now() + '.jpg';
    a.click();
    URL.revokeObjectURL(url);
  }, 'image/jpeg', 0.92);
});

startCamera();
</script>

</body>
</html>
