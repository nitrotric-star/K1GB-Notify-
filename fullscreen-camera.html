<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Full Screen Camera</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
  }
  #video {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    background: #000;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: -apple-system, sans-serif;
    font-size: 16px;
    text-align: center;
    padding: 20px;
    background: rgba(0,0,0,0.6);
  }
  #video.mirror {
    transform: scaleX(-1);
  }
  #controls {
    position: fixed;
    bottom: 24px;
    left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 10;
  }
  button {
    background: rgba(255,255,255,0.15);
    border: 2px solid #fff;
    color: #fff;
    border-radius: 50%;
    width: 42px; height: 42px;
    font-size: 16px;
    backdrop-filter: blur(4px);
  }
  #shotBtn {
    width: 54px; height: 54px;
    font-size: 20px;
  }
  #torchBtn.active {
    background: #ffe066;
    color: #000;
  }
  #torchBtn[disabled] {
    opacity: 0.3;
  }
  #fsBtn {
    position: fixed;
    top: 16px; right: 16px;
    width: 40px; height: 40px;
    font-size: 15px;
    z-index: 10;
  }
  #canvas { display: none; }
  #flash {
    position: fixed; inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 20;
  }
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="flash"></div>
<div id="overlay" style="display:none"></div>

<button id="fsBtn" title="Fullscreen">⛶</button>

<div id="controls">
  <button id="switchBtn">⟲</button>
  <button id="shotBtn">●</button>
  <button id="torchBtn">⚡</button>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const overlay = document.getElementById('overlay');
const flash = document.getElementById('flash');
const shotBtn = document.getElementById('shotBtn');
const switchBtn = document.getElementById('switchBtn');
const torchBtn = document.getElementById('torchBtn');
const fsBtn = document.getElementById('fsBtn');

let currentStream = null;
let facingMode = 'environment'; // back camera by default
let torchOn = false;

async function startCamera() {
  if (currentStream) {
    currentStream.getTracks().forEach(t => t.stop());
  }
  torchOn = false;
  torchBtn.classList.remove('active');
  try {
    overlay.style.display = 'none';
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });
    currentStream = stream;
    video.srcObject = stream;
    video.classList.toggle('mirror', facingMode === 'user');

    // torch (flash) only works on the back camera, if the device supports it
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    torchBtn.disabled = !(facingMode === 'environment' && caps.torch);
  } catch (err) {
    overlay.style.display = 'flex';
    overlay.textContent = 'Camera access failed: ' + err.message;
  }
}

switchBtn.addEventListener('click', () => {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  startCamera();
});

torchBtn.addEventListener('click', () => {
  if (!currentStream) return;
  const track = currentStream.getVideoTracks()[0];
  torchOn = !torchOn;
  track.applyConstraints({ advanced: [{ torch: torchOn }] }).catch(() => {});
  torchBtn.classList.toggle('active', torchOn);
});

fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
    fsBtn.textContent = '×';
  } else {
    document.exitFullscreen().catch(() => {});
    fsBtn.textContent = '⛶';
  }
});

shotBtn.addEventListener('click', () => {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  flash.style.transition = 'none';
  flash.style.opacity = '0.8';
  requestAnimationFrame(() => {
    flash.style.transition = 'opacity 0.3s';
    flash.style.opacity = '0';
  });

  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'photo-' + Date.now() + '.jpg';
    a.click();
    URL.revokeObjectURL(url);
  }, 'image/jpeg', 0.92);
});

startCamera();
</script>

</body>
</html>
