<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Full Screen Camera</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
  }
  #video {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    background: #000;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: -apple-system, sans-serif;
    font-size: 16px;
    text-align: center;
    padding: 20px;
    background: rgba(0,0,0,0.6);
  }
  #controls {
    position: fixed;
    bottom: 30px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 20px;
    z-index: 10;
  }
  button {
    background: rgba(255,255,255,0.15);
    border: 2px solid #fff;
    color: #fff;
    border-radius: 50%;
    width: 64px; height: 64px;
    font-size: 22px;
    backdrop-filter: blur(4px);
  }
  #switchBtn {
    width: 48px; height: 48px;
    font-size: 18px;
  }
  #canvas { display: none; }
  #flash {
    position: fixed; inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 20;
  }
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="flash"></div>
<div id="overlay" style="display:none"></div>

<div id="controls">
  <button id="switchBtn">⟲</button>
  <button id="shotBtn">●</button>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const overlay = document.getElementById('overlay');
const flash = document.getElementById('flash');
const shotBtn = document.getElementById('shotBtn');
const switchBtn = document.getElementById('switchBtn');

let currentStream = null;
let facingMode = 'environment'; // back camera by default

async function startCamera() {
  if (currentStream) {
    currentStream.getTracks().forEach(t => t.stop());
  }
  try {
    overlay.style.display = 'none';
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });
    currentStream = stream;
    video.srcObject = stream;
  } catch (err) {
    overlay.style.display = 'flex';
    overlay.textContent = 'Camera access failed: ' + err.message;
  }
}

switchBtn.addEventListener('click', () => {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  startCamera();
});

shotBtn.addEventListener('click', () => {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  flash.style.transition = 'none';
  flash.style.opacity = '0.8';
  requestAnimationFrame(() => {
    flash.style.transition = 'opacity 0.3s';
    flash.style.opacity = '0';
  });

  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'photo-' + Date.now() + '.jpg';
    a.click();
    URL.revokeObjectURL(url);
  }, 'image/jpeg', 0.92);
});

// try to go fullscreen on first tap (mobile browsers block auto-fullscreen)
document.body.addEventListener('click', function requestFS() {
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
  document.body.removeEventListener('click', requestFS);
}, { once: true });

startCamera();
</script>

</body>
</html>
